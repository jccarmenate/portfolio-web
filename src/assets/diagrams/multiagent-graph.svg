<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <marker id="mg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
    <marker id="mg-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a3a3a3"/></marker>
    <pattern id="mg-dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#262626"/></pattern>
  </defs>
  <rect width="800" height="380" fill="#0a0a0a"/><rect width="800" height="380" fill="url(#mg-dots)"/>
  <g class="mono" font-size="11" text-anchor="middle">
    <!-- fila 1: pipeline -->
    <g fill="#171717" stroke="#34d399" stroke-width="1.5">
      <rect x="19" y="40" width="112" height="52" rx="10"/><rect x="149" y="40" width="112" height="52" rx="10"/>
      <rect x="279" y="40" width="112" height="52" rx="10"/><rect x="409" y="40" width="112" height="52" rx="10"/>
      <rect x="539" y="40" width="112" height="52" rx="10"/><rect x="669" y="40" width="112" height="52" rx="10"/>
    </g>
    <g fill="#f5f5f5">
      <text x="75" y="71">spec_analyst</text><text x="205" y="71">architect</text><text x="335" y="71">db_designer</text>
      <text x="465" y="71">backend_coder</text><text x="595" y="71">frontend_coder</text><text x="725" y="71">test_writer</text>
    </g>
    <!-- fila 2 -->
    <rect x="389" y="190" width="152" height="56" rx="10" fill="#171717" stroke="#34d399" stroke-width="1.5"/>
    <text x="465" y="214" fill="#f5f5f5">reviewer</text><text x="465" y="233" fill="#6ee7b7" font-size="11">decides who retries</text>
    <rect x="639" y="190" width="142" height="56" rx="10" fill="#052e16" stroke="#34d399" stroke-width="2"/>
    <text x="710" y="214" fill="#f5f5f5">docker_executor</text><text x="710" y="233" fill="#6ee7b7" font-size="11">pytest · npm build</text>
    <!-- fila 3 -->
    <rect x="639" y="306" width="142" height="48" rx="10" fill="#171717" stroke="#525252"/>
    <text x="710" y="335" fill="#f5f5f5">finalize</text>
    <rect x="389" y="306" width="152" height="48" rx="10" fill="#171717" stroke="#525252"/>
    <text x="465" y="335" fill="#f5f5f5">finalize_partial</text>
    <!-- sandbox note -->
    <g text-anchor="start" fill="#a3a3a3" font-size="11">
      <text x="19" y="206">sandbox: network_mode=none</text>
      <text x="19" y="224">non-root · cap_drop=ALL</text>
      <text x="19" y="242">no Docker socket · CPU/mem limits</text>
      <text x="19" y="300" fill="#a3a3a3">events → SQLite + WebSocket</text>
      <text x="19" y="318" fill="#a3a3a3">/ws/runs/{run_id} → live dashboard</text>
    </g>
  </g>
  <!-- flechas -->
  <g stroke="#34d399" stroke-width="1.6" fill="none" marker-end="url(#mg-a)">
    <path d="M133 66H145"/><path d="M263 66H275"/><path d="M393 66H405"/><path d="M523 66H535"/><path d="M653 66H665"/>
    <path d="M725 94V186"/>
    <path d="M637 218H545"/>
    <path d="M710 248V302"/>
  </g>
  <g stroke="#a3a3a3" stroke-width="1.4" fill="none" stroke-dasharray="5 5" marker-end="url(#mg-g)">
    <path d="M430 188C430 150 335 140 335 96"/>
    <path d="M455 188V96"/>
    <path d="M480 188C480 150 595 140 595 96"/>
    <path d="M505 188C505 150 700 140 700 96"/>
    <path d="M465 248V302"/>
    <path d="M650 248C620 292 590 320 545 328"/>
  </g>
  <g class="mono" font-size="10.5" fill="#a3a3a3">
    <text x="19" y="150">reviewer → fix: db | backend | frontend | tests</text>
    <text x="580" y="210" fill="#6ee7b7">failed</text>
    <text x="718" y="280" fill="#6ee7b7">passed</text>
    <text x="457" y="282" text-anchor="end">repeated failure</text>
    <text x="457" y="296" text-anchor="end">(circuit breaker)</text>
    <text x="604" y="272" text-anchor="end">iterations</text>
    <text x="604" y="286" text-anchor="end">exhausted</text>
  </g>
